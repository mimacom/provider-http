name: Publish Provider Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to use while publishing the package (e.g. v1.0.0-alpha.1)"
        default: ""
        required: false
      go-version:
        description: "Go version to use if building needs to be done"
        default: "1.27"
        required: false

jobs:
  publish-provider-package:
    # Only mima-release-* branches may publish/release the provider package;
    # release-fork.yml dispatches this workflow against that branch.
    if: startsWith(github.ref, 'refs/heads/mima-release-')
    uses: crossplane-contrib/provider-workflows/.github/workflows/publish-provider-non-family.yml@main
    with:
      registry_org: mimacom
      repository: provider-http
      version: ${{ github.event.inputs.version }}
      go-version: ${{ github.event.inputs.go-version }}
      cleanup-disk: true
    secrets:
      GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
      XPKG_MIRROR_TOKEN: ${{ secrets.XPKG_TOKEN }}
      XPKG_MIRROR_ACCESS_ID: ${{ secrets.XPKG_ACCESS_ID }}

  sign:
    name: Sign OCI Package
    needs: [publish-provider-package]
    runs-on: ubuntu-latest
    if: github.event.inputs.version != '' && startsWith(github.ref, 'refs/heads/mima-release-')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3

      - name: Sign OCI Package
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign \
            --key env://COSIGN_PRIVATE_KEY \
            --tlog-upload=false \
            --yes \
            ghcr.io/mimacom/${{ github.event.repository.name }}:${{ github.event.inputs.version }}

      # Publish the GitHub Release. It carries no key material: the public key is
      # distributed to the customer out-of-band and held centrally in
      # crossplane-gitops at release/cosign.pub (DCS-21). Shipping cosign.pub as an
      # asset of the very Release being verified proved nothing — an attacker able
      # to publish the artifact could publish a matching key.
      #
      # The Release itself is still load-bearing: crossplane-gitops
      # detect-releases.yml treats "a GitHub Release exists" as the definition of
      # released, so this step must keep creating it. Idempotent — a Release that
      # already exists is left alone.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "GitHub Release ${VERSION} already exists — nothing to do."
          else
            gh release create "${VERSION}" \
              --repo  ${{ github.repository }} \
              --title "${VERSION}" \
              --notes "mimacom signed release ${VERSION}."
          fi
